{% extends "base.html" %}

{% block title %}Iniciar Sesión - Servicio Técnico{% endblock %}

{% block body_class %}bg-light{% endblock %}

{% block content_public %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='images/icon-128.png') }}" alt="ServTec" style="width: 80px; height: 80px;">
                        <h4 class="mt-2">Servicio Tecnico</h4>
                        <p class="text-muted">Ingresa a tu cuenta</p>
                    </div>

                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted mt-3 small">
                Sistema de Gestión de Servicio Técnico
            </p>
        </div>
    </div>
</div>
{% endblock %}
