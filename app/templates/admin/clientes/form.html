{% extends "admin/base_admin.html" %}

{% block title %}{{ 'Editar' if cliente else 'Nuevo' }} Cliente - Admin{% endblock %}

{% block admin_content %}
<div class="mb-4">
    <a href="{{ url_for('admin.clientes') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Volver
    </a>
</div>

<div class="card">
    <div class="card-header">
        <h5 class="mb-0">{{ 'Editar Cliente' if cliente else 'Nuevo Cliente' }}</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Nombre / Razón Social *</label>
                    <input type="text" class="form-control" name="nombre" value="{{ cliente.nombre if cliente else '' }}" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">RIF/CI</label>
                    <input type="text" class="form-control" name="rif" value="{{ cliente.rif if cliente else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" value="{{ cliente.email if cliente else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Persona de Contacto</label>
                    <input type="text" class="form-control" name="persona_contacto" value="{{ cliente.persona_contacto if cliente else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono Principal</label>
                    <input type="text" class="form-control" name="telefono_principal" value="{{ cliente.telefono_principal if cliente else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Teléfono Secundario</label>
                    <input type="text" class="form-control" name="telefono_secundario" value="{{ cliente.telefono_secundario if cliente else '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Notas</label>
                    <textarea class="form-control" name="notas" rows="3">{{ cliente.notas if cliente else '' }}</textarea>
                </div>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> {{ 'Actualizar' if cliente else 'Guardar' }}
                </button>
                <a href="{{ url_for('admin.clientes') }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
