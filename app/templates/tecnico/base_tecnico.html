{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-3">
    {% block tecnico_content %}{% endblock %}
</div>

{% block bottom_nav %}
<nav class="bottom-nav">
    <a href="{{ url_for('tecnico.dashboard') }}" class="{{ 'active' if request.endpoint == 'tecnico.dashboard' }}">
        <i class="bi bi-house"></i>
        <span>Inicio</span>
    </a>
    <a href="{{ url_for('tecnico.ordenes') }}" class="{{ 'active' if 'orden' in request.endpoint }}">
        <i class="bi bi-clipboard"></i>
        <span>Órdenes</span>
    </a>
    <a href="{{ url_for('tecnico.mantenimientos') }}" class="{{ 'active' if 'mantenimiento' in request.endpoint }}">
        <i class="bi bi-wrench"></i>
        <span>Mant.</span>
    </a>
    <a href="{{ url_for('tecnico.tickets') }}" class="{{ 'active' if 'ticket' in request.endpoint }}">
        <i class="bi bi-ticket"></i>
        <span>Tickets</span>
    </a>
</nav>
{% endblock %}
{% endblock %}
