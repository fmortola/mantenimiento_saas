<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <title>Documento ya firmado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="text-center text-white mb-4">
                    <i class="bi bi-tools fs-1"></i>
                    <h4>ServTec</h4>
                </div>

                <div class="card">
                    <div class="card-body text-center p-5">
                        <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
                        <h4 class="mt-3">Documento ya firmado</h4>
                        <p class="text-muted">
                            El {{ tipo }} <strong>{{ numero }}</strong> ya fue firmado
                            {% if firma_fecha %}
                            el {{ firma_fecha.strftime('%d/%m/%Y a las %H:%M') }}
                            {% endif %}
                        </p>
                        <p class="small text-muted mt-4">
                            Si tiene alguna consulta, contacte a soporte tecnico.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
